name: Deploy web app to GitHub Pages

# Builds the website version of the app (the one you can "Add to Home
# Screen") and publishes it to GitHub Pages on every push, so the installed
# icon always opens the latest version — no separate build/release step.
on:
  push:
    branches:
      - claude/mvp-production-build-j5x1sd
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npm run build:web
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

      # Majlis Media Studio (media-app/) is a separate app with its own
      # Supabase project, published alongside the Founder OS site at
      # /Majlis-Admin/media/ rather than as its own GitHub Pages site
      # (one Pages deployment per repo). Its Supabase URL/publishable key
      # are safe to keep in plain view here — a "publishable" key is
      # explicitly meant to ship inside a browser bundle; access control is
      # enforced by Postgres Row Level Security, not by hiding this value.
      - run: npm ci
        working-directory: media-app

      - run: npm run build:web
        working-directory: media-app
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://yzzugkgrqbjwzcxsldmz.supabase.co
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_X1Seg-zrfhjj67yrsfmLcA_yWmdC41V

      - run: rm -rf dist/media && mkdir -p dist/media && cp -r media-app/dist/. dist/media/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
