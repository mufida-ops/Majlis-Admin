name: Publish Expo update

# Publishes an OTA update to the "preview" branch/channel every time code
# lands on the production branch, so Expo Go always has the latest build
# without anyone needing a local dev server running.
on:
  push:
    branches:
      - claude/mvp-production-build-j5x1sd
  workflow_dispatch: {}

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: |
          eas update --branch preview --message "${COMMIT_MESSAGE%%$'\n'*}" --non-interactive
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          # Passed as an env var (not interpolated into the script text) so
          # quote/newline characters inside the commit message can't break
          # the shell command that reads it.
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || format('Manual publish {0}', github.sha) }}
